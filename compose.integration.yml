name: kidsible-integration
services:
  mongodb-integration:
    image: mongodb/mongodb-community-server:8.0.29-ubi9-slim
    container_name: kidsible-mongodb-integration
    command: ["mongod", "--replSet", "kidsible-test-rs", "--port", "27018"]
    ports:
      - "127.0.0.1:27018:27018"
    volumes:
      - kidsible-integration-data:/data/db
      - kidsible-integration-config:/data/configdb
      - ./backend/integration/init-replica-set.js:/opt/kidsible/init-replica-set.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "127.0.0.1", "--port", "27018", "--eval", "const h=db.adminCommand({hello:1}); quit(h.setName==='kidsible-test-rs' && h.isWritablePrimary===true ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: "no"
volumes:
  kidsible-integration-data:
    name: kidsible-integration-data
  kidsible-integration-config:
    name: kidsible-integration-config
