name: kidsible-demo-replica
services:
  mongodb-demo:
    image: mongodb/mongodb-community-server:8.0.29-ubi9-slim
    container_name: kidsible-mongodb-demo
    hostname: kidsible-mongodb-demo
    command: ["mongod", "--replSet", "kidsible-demo-rs", "--port", "27019"]
    ports:
      - "127.0.0.1:27019:27019"
    volumes:
      - kidsible-demo-data:/data/db
      - kidsible-demo-config:/data/configdb
      - ./backend/demo-infrastructure/init-replica-set.js:/opt/kidsible/init-demo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "127.0.0.1", "--port", "27019", "--eval", "const h=db.adminCommand({hello:1}); quit(h.setName==='kidsible-demo-rs' && h.isWritablePrimary===true ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: "no"
volumes:
  kidsible-demo-data:
    name: kidsible-demo-data
  kidsible-demo-config:
    name: kidsible-demo-config
