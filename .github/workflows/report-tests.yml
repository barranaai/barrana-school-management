name: Report tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  report-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGOMS_DISABLE_POSTINSTALL: "1"
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Run focused report tests
        run: node --test backend/tests/reportDelivery.test.js backend/tests/reportLifecycle.test.js

      - name: Run complete report regression tests
        run: >-
          node --test
          backend/tests/dueReportsCalculatorContext.test.js
          backend/tests/guardianReportAccess.test.js
          backend/tests/legacyReportSafety.test.js
          backend/tests/reportDelivery.test.js
          backend/tests/reportLifecycle.test.js
          backend/tests/reportParticipantAuthorization.test.js
          backend/tests/reportTemplateContext.test.js
          backend/tests/reportTemplateRoutes.test.js
          backend/tests/reportUploadSafety.test.js
