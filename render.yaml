services:
  # Backend API Service
  - type: web
    name: barrana-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        fromDatabase:
          name: barrana-mongodb
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: OPENAI_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: BCRYPT_ROUNDS
        value: 12
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: LOG_LEVEL
        value: info

  # Frontend Static Site
  - type: static
    name: barrana-frontend
    buildCommand: npm install && npm run build:frontend
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        value: https://barrana-backend.onrender.com/api

databases:
  # MongoDB Database
  - name: barrana-mongodb
    databaseName: barrana_ai
    plan: free
